name: Update Profile Assets

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate banner and radars
        run: |
          python scripts/banner/generate.py
          python scripts/generate_radars.py
      - name: Generate GitHub stats
        env:
          GITHUB_USERNAME: nikhilkeshavmali
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/cards.py
      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: update profile assets"
          git push
